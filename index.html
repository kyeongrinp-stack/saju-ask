{"cond": "관성 2 이상 + 신약", "one": "일에서는, 자리보다 감당할 힘을 먼저 챙겨야 하는 쪽이에요.", "brief": ["자리와 책임의 별인 관성은 또렷한데 일간이 그보다 약해서, 자리가 나보다 먼저 움직이는 구조예요.", "특히 맡은 일은 자꾸 늘어나는데 몸과 시간이 먼저 지치는 장면이 반복될 수 있어요."], "scene": "일하는 모양을 보면, 자리는 잘 오는 쪽이에요. 맡겨 주는 사람이 많고, 거절을 못 해서 일이 늘어요. 그런데 하다 보면 내가 먼저 지치고, 잘하고 있는데도 늘 쫓기는 느낌이에요.", "read": "능력 문제가 아니라 순서 문제예요. 자리를 받기 전에 받쳐 줄 사람과 문서를 먼저 두면 같은 자리도 가볍게 져요. 나를 받쳐 주는 힘이 드는 시기에 그 사람이 생기고, 그때 일이 풀리는 편이에요. 자리를 고를 때는 크기보다 누가 같이 지는지를 먼저 보세요.", "fact_add": "명리에서는 이 배치를 자리가 나보다 힘이 센 구조로 봅니다. 받쳐 주는 힘이 들어올 때 풀리는 구조입니다."}, "org": {"cond": "관성 2 이상 + 인성 1 이상(신약 아님)", "one": "일에서는, 조직 안에서 오래 있을수록 자리가 단단해지는 쪽이에요.", "brief": ["자리와 규칙의 별인 관성이 또렷하고 나를 받쳐 주는 힘도 있어서, 조직 안에서 자라기 좋은 구조예요.", "특히 한곳에 오래 있을수록 인정이 쌓이고, 옮길 때마다 처음부터 다시 시작하는 장면이 반복될 수 있어요."], "scene": "일하는 모양을 보면, 규칙과 순서가 있는 곳에서 안정되는 쪽이에요. 맡은 역할을 제대로 하고, 위와 아래를 살피고, 시간이 지나면 어느새 믿고 맡기는 사람이 되어 있어요. 대신 판을 새로 짜는 일은 남보다 늦게 손이 가요.", "read": "이 구조에서는 자리가 나를 키우고, 그 자리에서 배운 것이 다시 나를 받쳐요. 그래서 옮기는 것보다 머무는 것이 결과가 좋고, 옮긴다면 같은 결의 조직으로 가는 게 맞아요. 규칙이 나를 묶는 것 같아도 이 사주에서는 규칙이 나를 지켜요. 오래 있을수록 자리가 단단해지는 사람이에요.", "fact_add": "명리에서는 이 배치를 관인상생, 곧 자리가 나를 받쳐 주는 힘을 키우고 그 힘이 다시 나를 세우는 구조로 봅니다."}, "duty": {"cond": "관성 2 이상(인성 없음, 신약 아님)", "one": "일에서는, 맡은 자리와 책임이 분명할 때 힘이 나는 쪽이에요.", "brief": ["자리와 책임의 별인 관성이 또렷해서, 역할이 분명한 자리에서 힘이 나는 구조예요.", "특히 시키는 일이 애매하면 답답하고, 맡은 범위가 정해지면 빨라지는 장면이 반복될 수 있어요."], "scene": "일하는 모양을 보면, 역할이 정해지면 누가 보지 않아도 끝까지 하는 쪽이에요. 책임이 곧 힘이라 맡은 일이 무거울수록 오히려 집중이 돼요. 대신 뭘 해야 하는지 애매한 자리에서는 힘이 빠지고, 말로만 하는 일에는 마음이 안 가요.", "read": "이 구조에서는 책임이 있는 자리에서 결과가 나와요. 자리를 고를 때는 이름보다 내 역할이 어디까지인지가 분명한 곳이 맞아요. 규칙이 있을 때 더 강해지는 사람이라, 규칙이 흐린 조직에서는 스스로 선을 그어 두는 게 방법이에요. 책임을 키우는 것이 이 사주에서는 자리를 키우는 길이에요.", "fact_add": "명리에서는 이 배치를 맡은 자리와 책임으로 일하는 구조로 봅니다."}, "maker": {"cond": "관성 1 이하 + 식상 2 이상", "one": "일에서는, 시키는 일보다 만드는 일에서 힘이 나는 쪽이에요.", "brief": ["자리의 별보다 밖으로 내는 힘인 식상이 커서, 기획하고 표현하는 일이 나를 끌고 가는 구조예요.", "특히 정해진 틀 안에서는 답답하고, 없던 것을 만들어 낼 때 살아나는 장면이 반복될 수 있어요."], "scene": "일하는 모양을 보면, 없던 것을 만들어 내는 데서 힘이 나는 쪽이에요. 기획이 빠르고 말이 앞서고, 설명하고 설득하는 자리에서 눈이 반짝여요. 대신 정해진 절차를 그대로 따르는 일은 금방 지루해지고, 정리와 마무리는 늘 뒤에 남아요.", "read": "이 구조에서는 자리를 받는 것보다 자리를 만드는 것이 맞아요. 시키는 일만 있는 곳에서는 힘이 빠지고, 내가 짠 판에서는 같은 시간을 일해도 결과가 달라요. 다만 벌이는 힘이 커서 실행과 정리를 맡아 줄 사람이 옆에 있어야 오래 가요. 기획은 내가, 마무리는 나눠 갖는 것이 이 사주의 일하는 법이에요.", "fact_add": "명리에서는 이 배치를 밖으로 내는 힘이 일을 만드는 구조로 봅니다."}, "free": {"cond": "관성 0 + 식상 1 이하", "one": "일에서는, 정해진 자리보다 내 방식이 먼저 서는 쪽이에요.", "brief": ["자리와 규칙의 별인 관성이 원국에 없어서, 정해진 자리보다 내 방식이 먼저 서는 구조예요.", "특히 위에서 정해 주는 틀 안에서는 힘이 빠지고, 내 판을 짤 때 살아나는 장면이 반복될 수 있어요."], "scene": "일하는 모양을 보면, 누가 정해 준 대로 하는 게 갑갑한 쪽이에요. 규칙이 나를 지켜 준다는 느낌보다 묶는다는 느낌이 크고, 상사보다 내 판단을 믿어요. 그래서 조직에 있어도 내 방식으로 일할 수 있는 자리를 찾아 움직여요.", "read": "규칙이 없다고 일을 못 하는 게 아니에요. 규칙 밖에서 내 방식으로 일할 수 있는 자리를 찾는 게 먼저예요. 다만 자리의 별이 없다는 건 나를 지켜 주는 틀도 얇다는 뜻이라, 계약과 역할은 내가 먼저 문서로 세워 두어야 해요. 이 사주에서는 자리가 나를 정하는 게 아니라 내가 자리를 정해요.", "fact_add": "당신 원국에는 관성, 곧 자리와 규칙의 별이 없습니다. 명리에서는 이 배치를 자리를 받는 사람이 아니라 자리를 만드는 사람으로 봅니다."}, "steady": {"cond": "관성 1 + 식상 1 이하(나머지)", "one": "일에서는, 크게 벌이지 않고 하던 일을 꾸준히 넓히는 쪽이에요.", "brief": ["자리의 별도 벌이는 힘도 세지 않아서, 크게 튀지 않고 하던 일을 넓히는 구조예요.", "특히 갑자기 판을 바꾸면 힘이 빠지고, 조금씩 넓힐 때 결과가 쌓이는 장면이 반복될 수 있어요."], "scene": "일하는 모양을 보면, 일로 크게 흔들린 적이 많지 않은 쪽이에요. 무리해서 벌이지도, 겁이 나서 움츠러들지도 않아요. 주변에서 보면 일 이야기가 조용한 사람이고, 스스로는 내 자리가 어디인지 가끔 헷갈려요.", "read": "이 구조에서는 큰 전환보다 조금씩 넓히는 방식이 맞아요. 갑자기 판을 바꾸면 힘이 빠지고, 하던 일에 한 가지를 더할 때 결과가 쌓여요. 일의 큰 변화는 내가 만드는 게 아니라 시기가 만들어요. 그래서 이 사주에서는 다음 장들의 시기가 다른 무엇보다 중요해요.", "fact_add": "당신 원국에서는 자리의 별도 벌이는 힘도 두드러지지 않습니다. 명리에서는 이 배치를 하던 일을 꾸준히 넓히는 구조로 봅니다."}}, "fact_template": "명식의 관성 구조에서는, 자리와 규칙의 별인 관성이 {관성 n}자리{관성 자리 목록이 있으면: ({관성 자리})}입니다. 나를 받쳐 주는 힘인 인성은 {인성 n}자리이고, 밖으로 내는 힘인 식상은 {식상 n}자리입니다. 일간은 {신강·중화·신약}이라 {신강: 맡은 것을 밀어붙이는 힘이 있습니다 / 중화: 자리와 내 힘이 균형을 이룹니다 / 신약: 자리를 받으면 받쳐 줄 힘이 먼저 필요합니다}.", "evidence": ["natal:관성", "natal:인성", "strength"], "more": ["work_style", "biz_continue"], "fixed": {"table": "없음", "notes": "자리 뜻은 년주 바깥세상 자리, 월주 일하는 자리, 일지 배우자 자리, 시주 인생 후반 자리. 별은 제시 뒤 풀이(정관 자리와 규칙, 편관 책임과 압박, 정인 나를 받쳐주는 힘, 편인 남다른 배움·직감, 식신 꾸준히 만드는 힘, 상관 말재주·벌이는 힘). 돈 이야기는 쓰지 않는다."}}, "2": {"no": 2, "title": "일이 막히는 방식", "branch_by": "block", "rule": "work.js block과 같음. officer_strong(관성≥2) → pressed; output_strong(식상≥2) → talk; weak_self(신약) → load; rival_strong(비겁≥2) → overlap; 나머지 time(위 순서로 첫 조건). 체크리스트 5개 → 구조 단락(fact_add) → 방법(method) → 시기(timing_template, 직업 자리 월지 기준 3년 창) → 좋은 면(good).", "check_intro": "이 중에 몇 개나 해당되세요.", "check_outro": "세 개 이상이면 이 구조가 맞아요.", "branches": {"pressed": {"cond": "관성 2 이상", "one": "일이 안 되는 게 아니라, 위에서 누르는 힘 앞에서 작아지는 쪽이에요.", "brief": ["자리와 규칙의 별인 관성이 세서, 상사와 규칙이 나를 누르는 자리에서 막히는 구조예요.", "특히 실력과 상관없이 윗사람 앞에서 말이 줄고 결정을 미루는 장면이 반복될 수 있어요."], "checklist": ["상사가 바뀌면 일이 갑자기 힘들어져요.", "회의에서 하고 싶은 말을 삼킨 적이 많아요.", "규칙이 늘어나면 일보다 눈치가 먼저 늘어요.", "권한 없이 책임만 맡은 자리에 있었어요.", "잘하고 있는데도 늘 평가받는 느낌이에요."], "fact_add": "당신 사주에서는 나를 다루는 힘, 곧 관성이 {관성 n}자리로 셉니다. 명리에서는 이 배치를 자리와 규칙이 나보다 앞서는 구조로 봅니다. 막히는 자리는 실력이 아니라 위에서 누르는 힘이 있는 곳입니다.", "method": "막히는 길은 대개 하나예요. 권한 없이 책임만 지는 자리예요. 자리를 고를 때 권한을 나눠 주는 상사가 있는지를 먼저 보면 같은 일도 달라져요.", "good": "그런데 이 구조에는 좋은 면도 있어요. 규칙을 지키는 힘이 커서 큰 조직에서 믿음을 얻어요. 누르는 힘이 사라진 자리에서는 같은 사람이 가장 단단한 기둥이 돼요."}, "talk": {"cond": "관성 1 이하 + 식상 2 이상", "one": "일이 안 되는 게 아니라, 말이 먼저 나가고 실행이 늦게 붙는 쪽이에요.", "brief": ["밖으로 내는 힘인 식상이 세서, 계획과 말은 빠른데 실행과 정리가 뒤에 남는 구조예요.", "특히 시작은 여럿인데 끝까지 간 일은 몇 개 안 되는 장면이 반복될 수 있어요."], "checklist": ["아이디어를 말해 놓고 정리는 남이 했어요.", "시작한 일이 여럿인데 끝난 일은 적어요.", "회의에서 말이 길어져 결론이 늦어진 적이 있어요.", "규칙을 정하는 사람과 자주 부딪혀요.", "기획은 좋다는데 결과물이 늦다는 말을 들어요."], "fact_add": "당신 사주에서는 밖으로 내는 힘, 곧 식상이 {식상 n}자리로 셉니다. 명리에서는 이 배치를 말과 기획이 실행보다 앞서는 구조로 봅니다. 막히는 자리는 아이디어가 아니라 마무리입니다.", "method": "막히는 길은 대개 하나예요. 말한 뒤에 정리할 사람이 없는 자리예요. 실행을 맡아 줄 사람을 옆에 두고, 말한 것을 그날 문서로 남기면 흐름이 달라져요.", "good": "그런데 이 구조에는 좋은 면도 있어요. 없던 일을 만드는 힘이 커서 판이 바뀔 때 가장 먼저 움직여요. 말이 앞서는 자리와 새 판을 여는 힘이 같은 곳에서 나와요."}, "load": {"cond": "위 둘 아니고 신약", "one": "일이 안 되는 게 아니라, 받은 일이 무거워 몸이 먼저 지치는 쪽이에요.", "brief": ["일간이 약한 편이라, 일을 받으면 자리보다 몸과 시간이 먼저 지치는 구조예요.", "특히 거절을 못 해서 일이 쌓이고 결국 혼자 다 지고 있는 장면이 반복될 수 있어요."], "checklist": ["거절을 못 해서 일이 늘 쌓여 있어요.", "일을 받으면 며칠은 잠이 얕아져요.", "혼자 다 하고 나서 아무도 몰랐던 적이 있어요.", "쉬는 날에도 일 생각이 안 꺼져요.", "일이 많을 때 몸이 먼저 신호를 줘요."], "fact_add": "당신 사주에서는 일간이 {신강·중화·신약}이라 일을 받는 힘보다 받쳐 주는 힘이 먼저 필요합니다. 명리에서는 이 배치를 자리가 무겁게 오는 구조로 봅니다. 막히는 자리는 능력이 아니라 혼자 지는 자리입니다.", "method": "막히는 길은 대개 하나예요. 혼자 다 지는 자리예요. 일을 받기 전에 누가 같이 지는지를 먼저 정하고, 받쳐 주는 사람이 없는 자리는 크기가 커도 피하는 게 맞아요.", "good": "그런데 이 구조에는 좋은 면도 있어요. 맞춰 주는 힘이 커서 어느 팀에 가도 빨리 자리를 잡아요. 무거운 자리와 어디서든 녹아드는 힘이 같은 곳에서 나와요."}, "overlap": {"cond": "위 셋 아니고 비겁 2 이상", "one": "일이 안 되는 게 아니라, 사람과 역할이 겹치는 자리에서 막히는 쪽이에요.", "brief": ["나와 같은 힘인 비겁이 세서, 같은 자리를 놓고 동료와 부딪히기 쉬운 구조예요.", "특히 내가 한 일인데 공이 나뉘거나 역할이 겹쳐 힘이 빠지는 장면이 반복될 수 있어요."], "checklist": ["같은 일을 하는 동료와 자주 비교돼요.", "내가 한 일인데 공이 나뉜 적이 있어요.", "역할이 겹쳐서 서로 미루거나 부딪혔어요.", "팀보다 혼자 할 때 결과가 또렷해요.", "경쟁이 붙으면 일보다 사람에 신경이 가요."], "fact_add": "당신 사주에서는 나와 같은 힘, 곧 비겁이 {비겁 n}자리로 셉니다. 명리에서는 이 배치를 같은 자리를 놓고 사람과 부딪히기 쉬운 구조로 봅니다. 막히는 자리는 실력이 아니라 역할이 겹치는 곳입니다.", "method": "막히는 길은 대개 하나예요. 역할이 겹치는데 나누지 않은 자리예요. 시작할 때 누가 무엇을 맡는지 문서로 나누면 같은 팀에서도 힘이 빠지지 않아요.", "good": "그런데 이 구조에는 좋은 면도 있어요. 사람 속에서 힘이 나서 경쟁이 있는 판에서 오히려 실력이 올라가요. 부딪히는 자리와 사람을 끄는 힘이 같은 곳에서 나와요."}, "time": {"cond": "나머지(기본값)", "one": "막히는 구조는 약하고, 일이 꼬이는 해가 따로 있는 쪽이에요.", "brief": ["원국에서 일을 막는 힘이 세지 않아서, 평소에는 막히는 자리가 뚜렷하지 않은 구조예요.", "특히 어떤 해에만 직업 자리가 흔들려 일이 한꺼번에 꼬이는 장면이 반복될 수 있어요."], "checklist": ["평소에는 일이 크게 막히지 않아요.", "그런데 어떤 해에는 유독 일이 꼬였어요.", "그 해에 자리를 옮기거나 상사가 바뀌었어요.", "지나고 보면 그 해가 문제였어요.", "일이 꼬일 때 이유를 나한테서 찾았어요."], "fact_add": "당신 사주에서는 일을 막는 힘이 자리로 정해져 있지 않습니다. 명리에서는 이 배치를 막히는 자리보다 막히는 해가 따로 있는 구조로 봅니다. 직업 자리(월지)가 세운과 부딪히는 해에 일이 꼬입니다.", "method": "그래서 이 사주에서 막히는 일은 자리의 문제가 아니라 시기의 문제예요. 어떤 해인지만 알면 대부분 피할 수 있어요. 그 해에 자리를 옮기는 결정을 서두르지 않는 것만으로도 흐름이 달라져요.", "good": "이 구조의 좋은 면은 막히는 자리가 정해져 있지 않다는 거예요. 시기만 지키면 일이 오래 이어져요."}}, "timing_template": {"hit": "가까운 해로는 {해 목록}에 직업 자리가 흔들려요. 그 해에는 자리를 옮기는 결정을 서두르지 않는 게 맞아요.", "none": "앞으로 세 해는 직업 자리가 흔들리지 않아요. 막히는 흐름이 약한 시기예요."}, "fact_year": {"chung": "{년}년은 세운 지지가 직업 자리(월지)와 충이 되는 해라, 자리 자체가 흔들립니다.", "wonjin": "{년}년은 세운 지지가 직업 자리(월지)와 원진이 되는 일할 때 제일 잘 되는 쪽이에요.", "brief": ["자리의 별과 벌이는 힘이 둘 다 또렷해서, 완전한 독립보다 반독립이 맞는 구조예요.", "특히 조직에만 있으면 답답하고 혼자만 있으면 불안해지는 장면이 반복될 수 있어요."], "scene": "일의 모양을 보면, 조직에 있으면 내 판을 짜고 싶고 혼자 있으면 조직의 틀이 그리운 쪽이에요. 둘 다 있어서 어느 한쪽으로 몰아가면 다른 쪽이 비어요. 조직 안에서 내 몫이 분명한 자리에 있을 때 가장 오래, 가장 잘 일해요.", "read": "그래서 맞는 자리는 반독립이에요. 조직 안의 독립된 팀, 지분이 있는 파트너, 본업 위의 내 판 같은 모양이 이 구조와 맞아요. 어느 한쪽을 버리고 다른 쪽으로 몰아가면 남은 힘이 비어서 오래 못 가요. 두 힘을 같이 쓸 수 있는 자리를 고르는 게 기준이에요.", "fact_add": "명리에서는 이 배치를 조직과 독립 두 힘이 함께 있는 구조로 봅니다."}, "neither": {"cond": "org≤1, indie≤1", "one": "일의 모양을 보면, 조직형도 독립형도 굳어 있지 않아 시기가 정하는 쪽이에요.", "brief": ["자리의 별도 벌이는 힘도 세지 않아서, 어느 한쪽으로 굳어 있지 않은 구조예요.", "특히 어떤 시기에는 조직이, 어떤 시기에는 내 일이 잘 맞는 식으로 달라지는 장면이 반복될 수 있어요."], "scene": "일의 모양을 보면, 조직형이다 독립형이다 한 가지로 굳어 있지 않은 쪽이에요. 흐름이 바뀔 때마다 잘 맞는 자리가 달라지고, 그래서 남들이 정해 준 형에 맞추면 어긋나요. 스스로도 내가 어느 쪽인지 오래 고민했을 거예요.", "read": "그래서 이 사주에서는 형을 고르는 것보다 시기를 보는 게 먼저예요. 지금 대운의 별이 자리와 문서 쪽이면 조직이, 벌이는 힘 쪽이면 내 일이 맞아요. 형이 없다는 건 어느 쪽으로도 갈 수 있다는 뜻이에요. 지금이 어느 쪽인지는 다음 장들이 정해요.", "fact_add": "명리에서는 이 배치를 형이 굳어 있지 않아 대운이 방향을 정하는 구조로 봅니다."}}, "fact_template": "명식에서 조직 쪽 힘은 관성, 곧 자리와 규칙의 별과 인성, 곧 나를 받쳐 주는 힘에서 봅니다. 독립 쪽 힘은 식상, 곧 벌이는 힘과 재성, 곧 결과를 다루는 힘에서 봅니다. 당신 사주에는 관성이 {관성 n}, 인성이 {인성 n}, 식상이 {식상 n}, 재성이 {재성 n}입니다.", "work_style": {"left": "같이 보면, 한 우물형이에요. 오래 있을수록 인정이 쌓여요.", "right": "같이 보면, 이동형이에요. 자리를 옮길 때 성장하고 한곳에 오래 있으면 답답해져요.", "both": "같이 보면, 한 회사 안에서 역할을 바꾸는 방식이 맞아요.", "neither": "같이 보면, 한 우물형도 이동형도 강하지 않아요. 역마가 드는 해에 움직이고 아닌 해는 머무는 게 맞아요."}, "condition": "형이 정해졌다고 지금 당장 바꾸라는 뜻은 아니에요. 시기는 지금 대운과 올해 흐름이 따로 정해요.", "evidence": ["natal:관성", "natal:식상", "strength"], "more": ["biz_continue", "job_or_biz"], "fixed": {"table": "없음", "notes": "neither는 근거에 daeunEvidence를 한 줄 더한다(코드와 같음). 재물 3장(월급형·성과형)과 겹치지 않게 돈의 형태는 말하지 않고 자리·평가 방식만 말한다."}}, "4": {"no": 4, "title": "일이 커지는 시기", "branch_by": "daeunPosition(관성·인성)", "rule": "daeunRows(f,['관성','인성'])의 level(천간·지지 둘 다 2, 하나 1, 없음 0)로 판정. now = 지금 대운 level 1 이상이고(지금 level 2이거나 앞 20년 안에 level 2 대운이 없음). ahead = 지금 level 2가 아니고 앞 20년(다음 두 대운) 안에 level 2 대운이 있음, 또는 지금 level 0이고 앞 20년 안에 level 1 이상이 있음(composer bigDaeun과 같은 결과). past = 지금·앞 20년에 없고 지나간 대운에 level 1 이상. none = 표에 없음. beforeFirst는 첫 대운을 지금으로 보고 같은 규칙. 대운이 무엇인지는 쓰지 않고 흐름 리포트 4장으로 보낸다.", "labels": {"편재": {"word": "판이 커짐", "desc": "일이 밖으로 넓어지고 판이 커지는 시기"}, "정재": {"word": "실속의 자리", "desc": "맡은 일이 결과로 차곡차곡 쌓이는 시기"}, "식신": {"word": "만드는 자리", "desc": "꾸준히 만들어 내는 일에서 이름이 나는 시기"}, "상관": {"word": "벌이는 자리", "desc": "새 판을 벌이고 규칙과 부딪히기 쉬운 시기"}, "비견": {"word": "역할이 겹침", "desc": "동료와 경쟁자가 늘고 역할이 겹치는 시기"}, "겁재": {"word": "나누는 자리", "desc": "같이 하는 일이 늘고 내 몫이 흐려지기 쉬운 시기"}, "정관": {"word": "자리가 굳음", "desc": "직함과 승진, 규칙 안의 자리가 잡히는 시기"}, "편관": {"word": "책임의 자리", "desc": "맡은 일이 커지고 압박도 함께 오는 시기"}, "정인": {"word": "자격이 붙음", "desc": "문서와 자격, 받쳐 주는 사람이 오는 시기"}, "편인": {"word": "준비의 자리", "desc": "남다른 배움으로 다음 자리를 준비하는 시기"}}, "branch_suffix": {"재성": "결과가 따라와요", "식상": "벌이는 힘이 더해져요", "비겁": "역할을 나누게 돼요", "관성": "자리와 책임이 따라와요", "인성": "문서와 자격이 받쳐요"}, "branches": {"now": {"cond": "지금 대운에 자리·자격의 별이 들어 있음(위 규칙)", "one": "지금 열 해가 자리와 자격이 앞자리에 와 있는 시기예요.", "brief": ["대운 표에서 자리와 자격의 별이 든 열 해가 바로 지금이라, 일이 인생의 앞자리에 있는 흐름이에요.", "특히 맡은 것이 커지고 이때 정한 자리가 오래 남는 장면이 반복될 수 있어요."], "read": "그러니까 지금은 옮길지 말지를 재는 때가 아니라 자리를 굳히는 때예요. 이 열 해에 받은 자리와 자격이 다음 열 해의 바탕이 돼요. 서두를 필요는 없지만 미룰 이유도 없어요. 지금 열 해를 아는 것이 이 표에서 가장 큰 값이에요."}, "ahead": {"cond": "자리·자격의 별이 든 큰 대운이 앞 20년 안에 있음", "one": "일이 앞자리로 오는 큰 시기가 아직 앞에 남아 있어요.", "brief": ["대운 표에서 자리와 자격의 별이 든 열 해가 지금보다 뒤에 있어서, 지금은 그 시기로 가는 길목이에요.", "특히 지금 서둘러 옮긴 자리보다 그때에 맞춰 준비한 자격이 커지는 장면이 반복될 수 있어요."], "read": "그러니까 큰 자리는 아직 오지 않았어요. 지금 열 해는 그 시기에 쓸 자격과 사람과 실적을 채우는 구간이에요. 조급하게 자리를 당기려 하면 힘만 빠지고, 준비를 미루면 그 시기가 와도 잡을 게 없어요. 표에서 그 열 해의 시작 해를 기억해 두세요."}, "past": {"cond": "자리·자격의 별이 든 대운이 지금보다 앞에만 있음", "one": "일이 앞자리였던 큰 시기는 지나갔고, 앞으로는 일의 모양이 바뀌어요.", "brief": ["대운 표에서 자리와 자격의 별이 든 열 해는 이미 지나갔고, 앞으로는 다른 별이 일을 끄는 흐름이에요.", "특히 예전처럼 자리를 좇으면 답답하고, 만든 것과 사람에서 일이 오는 장면이 반복될 수 있어요."], "read": "그러니까 지난 시기의 자리를 기준으로 지금을 재면 늘 아쉬워요. 그때 자리가 요란했던 것은 시기가 그랬던 거고, 앞으로는 다른 힘이 일을 끌어요. 표에서 다음 열 해에 무엇이 앞자리인지 보고, 그 힘에 맞는 일의 모양으로 바꾸는 게 맞아요. 지나간 시기의 자리는 다음 시기의 밑천이 돼요."}, "none": {"cond": "표 안에 자리·자격의 별이 든 대운이 없음", "one": "일이 앞자리로 오는 큰 시기는 표에 없고, 해마다 흐름이 정해요.", "brief": ["대운 표에 자리와 자격의 별이 든 열 해가 없어서, 일은 해마다 들어오는 흐름과 내가 벌이는 활동으로 움직이는 구조예요.", "특히 큰 자리를 기다리기보다 그 해의 강한 달에 움직일 때 달라지는 장면이 반복될 수 있어요."], "read": "그러니까 이 사주에서는 열 해 단위의 큰 자리보다 해 단위의 움직임이 쌓여요. 대운 표는 배경이고, 세운 표가 앞자리예요. 자리를 기다리며 미루기보다 내가 벌이는 활동이 자리를 대신해요. 다음 장들의 달력이 이 사주에서는 지도예요."}}, "fact_template": "이 표는 성인 이후의 대운마다 일이 어떤 모양이었고 어떤 모양이 되는지를 정리한 것입니다. 자리와 자격의 별(관성·인성)이 든 열 해를 강함으로 표시했습니다. 대운이 무엇이고 지금 대운이 전체적으로 어떤 시기인지는 나의 흐름 리포트 4장에 있습니다.", "row_template": "{나이 구간}, {시작 해}년부터 {끝 해}년은 {한마디}의 열 해예요. {풀이}이고, 지지로는 {지지 구절}.", "row_marks": {"current": "지금이에요.", "next": "다음 열 해예요.", "past": "그때 자리가 요란했다면 잘못 산 게 아니라 시기가 그랬던 거예요."}, "evidence": ["daeun:current", "daeun:list(관성·인성 level)"], "more": ["promotion", "job_when"], "fixed": {"table": "대운 띠: 성인 이후(만 20세가 든 대운부터) 다섯 줄. 열은 시기(나이·연도) / 대운(간지·천간 별·지지 별) / 한마디(labels.word) / 무슨 시기인가(labels.desc). 관성·인성 든 대운 강함(2), 하나만 보통(1). 천간과 지지가 같은 묶음이면 지지 구절 생략.", "notes": "row_template은 표 줄마다 한 단락(과거 → 지금 → 다음 → 그 뒤), 마지막 단락은 분기 read. 강함이 좋고 잔잔함이 나쁘다는 뜻이 아니라 움직임의 크기라는 문장을 표 설명에 붙인다."}}, "5": {"no": 5, "title": "지금 대운의 일", "branch_by": "daeunWorkGroup", "rule": "daeun.current의 천간·지지에 관성이 있으면 관성, 없고 인성이 있으면 인성(일의 별 우선). 둘 다 없으면 천간 별 묶음(재성·식상·비겁). daeun.beforeFirst면 before. 표를 다 지난 경우는 마지막 대운을 current로 본다. 대운 전체 설명은 쓰지 않고 '자세한 대운 설명 보기 › 나의 흐름 리포트 4장' 링크를 살짝 보기 아래에 둔다.", "branches": {"관성": {"cond": "지금 대운 천간 또는 지지에 관성", "one": "지금은 옮기는 때가 아니라, 자리를 굳히는 때예요.", "brief": ["지금 대운에 자리와 책임의 별이 들어와 있어서, 일이 인생의 앞자리에 있는 시기예요.", "특히 맡은 것은 커지는데 내 시간은 줄어드는 장면이 반복될 수 있어요."], "scene": "일의 흐름을 보면, {시작 해}년쯤부터 이런 게 늘었을 거예요. 맡은 일이 커졌고, 직함이나 책임이 생겼고, 내가 빠지면 안 되는 자리가 됐어요. 그런데 그만큼 내 시간은 줄고, 어깨는 무거워졌어요.", "method": "이럴 때 자리를 자주 옮기면 쌓인 것이 흩어져요. 대신 지금 자리에서 역할을 분명히 하고 권한을 문서로 받으면 자리가 굳어요. 옮긴다면 같은 결의 더 큰 자리로, 강한 달에 정하세요. 이 열 해의 일은 크기가 아니라 자리에서 나와요."}, "인성": {"cond": "관성 없음, 천간 또는 지지에 인성", "one": "지금은 자리보다 자격과 문서가 먼저 움직이는 때예요.", "brief": ["지금 대운에 나를 받쳐 주는 별이 들어와 있어서, 자격과 문서와 사람이 일의 바탕을 채우는 시기예요.", "특히 결과는 더딘데 배우고 준비하는 일이 늘어나는 장면이 반복될 수 있어요."], "scene": "일의 흐름을 보면, {시작 해}년쯤부터 이런 게 늘었을 거예요. 배우는 일이 생기고, 자격이나 계약 같은 문서가 움직이고, 나를 도와주는 윗사람이 나타났어요. 대신 눈에 보이는 자리는 더디게 와서 답답한 때도 있어요.", "method": "이럴 때 자리를 서두르면 준비가 덜 된 채로 올라가요. 대신 자격과 문서를 채우면 다음 시기에 자리가 따라와요. 옮긴다면 배울 것이 있는 자리로, 계약은 문서의 달에 마무리하세요. 이 열 해에 채운 것이 그다음 열 해의 자리가 돼요."}, "재성": {"cond": "일의 별 없음, 천간 별이 재성", "one": "지금은 자리보다 결과로 평가받는 때라, 실적이 자리를 대신해요.", "brief": ["지금 대운에 일의 별 대신 결과의 별이 들어와 있어서, 자리보다 실적이 앞서는 시기예요.", "특히 직함은 그대로인데 일과 결과는 계속 늘어나는 장면이 반복될 수 있어요."], "scene": "일의 흐름을 보면, {시작 해}년쯤부터 이런 게 늘었을 거예요. 결과로 평가받는 일이 많아지고, 바빠지고, 손에 잡히는 실적이 생겼어요. 그런데 자리나 직함은 그만큼 따라오지 않아 억울한 때도 있어요.", "method": "이럴 때 자리를 좇으면 어긋나요. 대신 결과를 문서로 남겨 두면 다음 시기에 자리가 그 위에 얹혀요. 옮긴다면 성과가 보이는 자리로, 정산 기준을 먼저 받으세요. 이 열 해의 일은 자리가 아니라 실적에서 나와요."}, "식상": {"cond": "일의 별 없음, 천간 별이 식상", "one": "지금은 자리보다 내가 벌이는 활동이 일을 만드는 때예요.", "brief": ["지금 대운에 일의 별 대신 벌이는 별이 들어와 있어서, 시키는 일보다 만드는 일이 앞서는 시기예요.", "특히 새로 시작한 일은 늘어나는데 자리는 흐릿해지는 장면이 반복될 수 있어요."], "scene": "일의 흐름을 보면, {시작 해}년쯤부터 이런 게 늘었을 거예요. 하고 싶은 일이 많아지고, 기획하고 말하는 자리가 늘고, 규칙과 상사가 답답해졌어요. 새로 벌인 것은 여럿인데 어디에 속해 있는지는 흐릿해요.", "method": "이럴 때 정해진 자리를 지키려 하면 힘이 빠져요. 대신 벌이는 활동에서 실적을 만들고, 실행과 마무리를 맡아 줄 사람을 옆에 두세요. 옮긴다면 내 방식으로 일할 수 있는 자리로 가되, 계약은 문서의 달에 하세요. 이 열 해의 일은 자리가 아니라 활동에서 나와요."}, "비겁": {"cond": "일의 별 없음, 천간 별이 비겁", "one": "지금은 자리보다 사람과 역할이 먼저 움직이는 때예요.", "brief": ["지금 대운에 일의 별 대신 나와 같은 별이 들어와 있어서, 동료와 경쟁자가 늘고 역할이 겹치는 시기예요.", "특히 같이 하자는 제안은 느는데 내 몫은 흐려지는 장면이 반복될 수 있어요."], "scene": "일의 흐름을 보면, {시작 해}년쯤부터 이런 게 늘었을 거예요. 같이 일하는 사람이 늘고, 같이 하자는 제안이 오고, 경쟁도 늘었어요. 그런데 내 역할이 어디까지인지 흐릿해져서 공이 나뉘는 일도 생겼어요.", "method": "이럴 때 혼자 다 하려 하면 사람도 몫도 잃어요. 대신 역할을 처음부터 문서로 나누고, 같이 하되 평가는 따로 받으세요. 옮긴다면 내 역할이 분명한 자리로 가는 게 맞아요. 이 열 해의 일은 자리가 아니라 역할을 나누는 데서 나와요."}, "before": {"cond": "daeun.beforeFirst", "one": "아직 첫 대운 전이라, 일은 원국의 모양 그대로 움직여요.", "brief": ["아직 큰 흐름이 시작되기 전이라, 일하는 방식은 원국의 모양대로만 움직이는 시기예요.", "특히 시기보다 타고난 일 습관이 앞서서 저 움직이는 구조라 혼자 지는 자리는 크기가 커도 오래 못 가요. 받쳐 주는 사람이 없는 자리는 피하는 게 이 사주에서 자리를 지키는 법이에요.", "org": "하나, 옮기기보다 한 자리를 키우세요. 자리가 나를 키우는 구조라 옮길 때마다 처음부터 다시 시작하는데, 머무는 만큼 인정이 쌓여요. 옮긴다면 같은 결의 조직으로, 규칙이 분명한 곳으로 가세요.", "duty": "하나, 내 역할이 어디까지인지 분명한 자리를 고르세요. 책임이 곧 힘인 구조라 애매한 자리에서는 힘이 빠지고, 범위가 정해지면 빨라져요. 규칙이 흐린 곳에서는 스스로 선을 먼저 그어 두세요.", "maker": "하나, 시키는 일보다 만들 수 있는 자리를 고르세요. 만드는 힘이 앞서는 구조라 정해진 절차만 있는 자리에서는 금방 힘이 빠져요. 기획은 내가 맡고 실행과 마무리는 나눠 갖는 자리가 이 사주와 맞아요.", "free": "하나, 내 방식으로 일할 수 있는 자리를 고르세요. 자리의 별이 없는 구조라 위에서 정해 주는 틀 안에서는 힘이 빠져요. 다만 나를 지켜 주는 틀도 얇으니, 계약과 역할은 내가 먼저 문서로 세우세요.", "steady": "하나, 판을 바꾸기보다 하던 일에 하나를 더하세요. 꾸준히 넓히는 구조라 갑자기 판을 바꾸면 힘이 빠지고, 조금씩 넓힐 때 결과가 쌓여요. 큰 전환은 내가 만드는 게 아니라 시기가 만들어요."}, "pattern": {"pressed": "둘, 권한을 나눠 주는 상사가 있는 곳을 고르세요. 위에서 누르는 힘 앞에서 막히는 구조라, 권한 없이 책임만 맡은 자리에서는 실력과 상관없이 작아져요. 규칙보다 사람이 자리를 정한다는 걸 기억하세요.", "talk": "둘, 실행을 맡을 사람이 옆에 있는 일을 고르세요. 말이 먼저 나가는 구조라 혼자 기획만 하는 자리는 결과가 늦어요. 말한 것을 그날 문서로 남기는 습관이 이 사주의 마무리예요.", "load": "둘, 일을 받기 전에 누가 같이 지는지 먼저 정하세요. 받은 일이 무거운 구조라 거절을 못 하면 몸이 먼저 지쳐요. 쉬는 날을 먼저 정해 두는 것이 이 사주에서는 일을 오래 하는 법이에요.", "overlap": "둘, 시작할 때 역할을 문서로 나누세요. 사람과 역할이 겹치는 구조라 나누지 않으면 공이 나뉘고 힘이 빠져요. 같이 하되 평가는 따로 받는 자리가 이 사주와 맞아요.", "time": "둘, 직업 자리가 흔들리는 해에는 옮기는 결정을 서두르지 마세요. 평소에는 막히는 자리가 정해져 있지 않은 구조라, 그 해만 피하면 대부분 풀려요. 옮긴다면 자리의 별이 드는 달에 정하고 문서의 달에 마무리하세요."}, "daeun": {"관성": "셋, 지금 열 해는 자리를 굳히는 데 힘을 쓰세요. 자리와 책임이 앞자리인 시기라 자주 옮기면 쌓인 것이 흩어져요. 권한을 문서로 받아 두는 것이 이 열 해의 기준이에요.", "인성": "셋, 지금 열 해는 자격과 문서를 채우세요. 받쳐 주는 힘이 앞자리인 시기라 자리는 더디고 준비는 늘어요. 이 열 해에 채운 자격이 그다음 열 해의 자리가 돼요.", "재성": "셋, 지금 열 해는 실적을 문서로 남기세요. 결과가 앞자리인 시기라 자리보다 성과가 먼저 움직여요. 성과가 자리로 바뀌는 건 다음 시기니, 지금은 기록이 기준이에요.", "식상": "셋, 지금 열 해는 벌인 만큼 마무리할 사람을 두세요. 활동이 앞자리인 시기라 시작은 많고 소속은 흐려져요. 내 방식으로 일하되 계약은 문서의 달에 하는 것이 이 열 해의 기준이에요.", "비겁": "셋, 지금 열 해는 역할을 처음부터 나누세요. 사람이 앞자리인 시기라 같이 하자는 제안이 느는데, 나누지 않으면 내 몫이 흐려져요. 같이 하되 평가는 따로 받는 것이 이 열 해의 기준이에요.", "before": "셋, 일하는 습관을 먼저 세우세요. 아직 큰 흐름 전이라 지금의 방식이 그대로 결과가 돼요. 첫 대운이 시작되기 전에 내 방식을 알아 두는 것이 이 시기의 준비예요."}}, "extra_ch3": {"org": "조직이 맞는 구조라면, 자리를 고를 때 규칙이 분명한 곳을 먼저 보세요.", "indie": "독립이 맞는 구조라면, 자리보다 결과로 평가받는 일을 고르세요.", "both": "둘 다 있는 구조라면, 조직 안에서 내 몫이 분명한 자리를 고르세요.", "neither": "구조가 뚜렷하지 않다면, 일을 고를 때 지금 대운의 별을 먼저 보세요."}, "guard": "마지막으로 선을 하나 긋겠습니다. 옮길지 남을지는 사주가 대신 정해 주지 않습니다. 언제가 좋은지, 어떤 자리가 당신과 맞는지까지가 사주가 말해 줄 수 있는 범위입니다.", "closing": "결정은 당신 몫으로 두고, 시기와 기준만 여기서 가져가세요.", "evidence": ["natal:관성", "natal:식상", "daeun:current"], "more": ["work_style", "biz_start_when"], "fixed": {"table": "없음", "notes": "본문 순서: opening → extra_ch3 → 기준 하나(type) → 둘(pattern) → 셋(daeun) → guard(합니다체) → closing. 기준 문장 안의 시기 숫자는 5·6장 엔진 값에서만 덧붙인다(예: 강한 달, 직업 자리가 흔들리는 해)."}}}};
REPORT_POOLS.love = {"id": "love", "title": "나의 사랑과 인연 리포트", "area": "love", "role": "사람 편. 사랑하는 방식·어긋나는 자리·맞는 상대의 결·인연이 드는 시기·만남과 결혼 달력·관계에서 지킬 것만 쓴다. 인연의 별은 성별에 따라 다르다(여성 관성, 남성 재성 = spouseGroup). 문장에서는 '인연의 별'이라 부르고 괄호로 (관성) 또는 (재성)을 붙인다. 얼굴·외모 예언 표현 금지. 만나고 헤어지는 결정은 사주가 정하지 않는다(GUARDS.relation). 대운이 무엇인지·올해가 전체적으로 어떤 해인지는 나의 흐름 리포트 4장으로 보낸다.", "sample": {"ch1": "expressive", "ch2": "female_output_strong", "ch3": "neither", "ch4": "now", "ch5": "spouse", "ch6": "인성", "ch7": "expressive×female_output_strong×spouse", "note": "견본 1981-12-06 20:50 여 무오. 인연의 별=관성 0, 일지 합(충·원진 없음), 식상 2 → expressive; 여성+식상 2 → female_output_strong; 관성 없음 → neither(일간 짝 계수·용신 금); 지금 대운 甲辰 편관(관성) → now·spouse; 2026 丙午 편인 → 인성."}, "cover": {"one": {"distance": "가까워질수록 거리를 조절하는 게 관계의 기술인 사주예요.", "swept": "사람에게 끌려가기 쉬워서, 내 기준을 먼저 세워야 하는 사주예요.", "steady": "관계가 생기면 오래 붙잡는, 인연의 별이 또렷한 사주예요.", "expressive": "마음을 먼저 보여 주고 상대를 기다리는 사주예요.", "independent": "관계보다 나를 먼저 세우고, 혼자서도 괜찮은 사주예요.", "quiet": "인연은 안에서 만들기보다 시기가 데려오는 사주예요."}, "brief": {"distance": ["배우자 자리가 다른 자리와 부딪히고 있어서, 관계가 가까워질수록 흔들리기 쉬운 구조예요.", "특히 잘 지내다가 같이 살 이야기가 나올 때쯤 어긋나는 장면이 반복될 수 있어요."], "swept": ["인연의 별은 또렷한데 일간이 그보다 약해서, 사람이 나보다 먼저 움직이는 구조예요.", "특히 상대가 이끄는 대로 따라가다 어느새 내 기준을 잃는 장면이 반복될 수 있어요."], "steady": ["인연의 별이 또렷하고 나도 흔들리지 않아서, 관계가 생기면 오래 붙잡는 구조예요.", "특히 끝난 관계도 쉽게 놓지 못하고 오래 마음에 남는 장면이 반복될 수 있어요."], "expressive": ["인연의 별보다 밖으로 내는 힘이 커서, 마음을 먼저 보여 주고 상대를 기다리는 구조예요.", "특히 내 말이 앞서서 상대의 말이 줄어드는 장면이 반복될 수 있어요."], "independent": ["인연의 별보다 나와 같은 힘이 커서, 관계보다 나를 먼저 세우는 구조예요.", "특히 혼자가 편해서 상대에게 자리를 내주지 못하는 장면이 반복될 수 있어요."], "quiet": ["인연의 별이 원국에 세지 않아서, 만남은 안에서보다 시기가 데려오는 구조예요.", "특히 평소에는 조용하다가 어떤 해에만 인연이 한꺼번에 오는 장면이 반복될 수 있어요."]}, "third_line_rule": "올해·내년 달력(인연의 별 in + 일지 합·충 + 도화, palace=spouse)의 강함(2) 달 + 3년 창에서 가장 강한 해 + 20년 안의 인연의 별 대운(bigDaeun)이 있으면 그 시작 해. 없으면 '앞으로 세 해는 인연이 잔잔하고, 큰 시기는 대운 표에서 와요.' 소개 화면은 숫자 없는 문장을 그대로 쓴다."}, "ch": {"1": {"no": 1, "title": "나는 어떻게 사랑하는 사람인가", "branch_by": "loveType", "rule": "love.js loveType과 같음. spouse_palace_clash(일지가 다른 지지와 충·원진) → distance; sp=level(spouseGroup)≥2이고 신약 → swept; sp≥2 → steady; 식상≥2 → expressive; 비겁≥2 → independent; 나머지 quiet(위 순서로 첫 조건). 성별 보조 문장은 fact_adds_optional(female_output: 여성+식상≥2 / male_rival: 남성+비겁≥2). 배우자 자리(일지) 별 묶음 문장은 palace_read.", "branches": {"distance": {"cond": "일지에 충 또는 원진", "one": "사랑에서는, 가까워질수록 거리를 조절하는 게 관계의 기술이에요.", "brief": ["배우자 자리(일지)가 다른 자리와 부딪히고 있어서, 관계가 가까워질수록 흔들리기 쉬운 구조예요.", "특히 잘 지내다가 같이 살 이야기가 나올 때쯤 어긋나는 장면이 반복될 수 있어요."], "scene": "관계의 모양을 보면, 멀리 있을 때는 잘 맞는데 가까워지면 부딪히는 쪽이에요. 연락할 때는 좋다가 같이 지내기 시작하면 사소한 것이 크게 걸려요. 그래서 관계가 깊어질 때마다 내가 이상한가 싶은 마음이 들었을 거예요.", "read": "이 구조는 사랑이 부족해서가 아니라 배우자 자리가 흔들리는 자리라서 그래요. 거리를 좁히는 속도를 상대에게 맞추지 말고 내 속도로 가면 오래 가요. 같이 사는 방식도 붙어 있기보다 각자의 자리를 두는 쪽이 이 사주와 맞아요. 거리는 멀어지는 게 아니라 지키는 거예요.", "fact_add": "당신 원국에서는 배우자 자리(일지)가 {자리 b}와 {관계}입니다. 명리에서는 이 배치를 관계가 가까워질수록 흔들리기 쉬운 자리로 봅니다."}, "swept": {"cond": "인연의 별 2 이상 + 신약", "one": "사랑에서는, 사람에게 끌려가기 쉬워서 내 기준이 먼저 필요한 쪽이에요.", "brief": ["인연의 별은 또렷한데 일간이 그보다 약해서, 사람이 나보다 먼저 움직이는 구조예요.", "특히 상대가 이끄는 대로 따라가다 어느새 내 기준을 잃는 장면이 반복될 수 있어요."], "scene": "관계의 모양을 보면, 사람이 먼저 다가오고 나는 따라가는 쪽이에요. 상대가 원하는 대로 맞춰 주다 보면 어느새 내 일정과 마음이 상대 중심으로 돌아가 있어요. 헤어지고 나서야 내가 원한 게 뭐였는지 알 때가 있어요.", "read": "끌려가는 힘이 세다는 건 나쁜 게 아니에요. 사람을 깊이 받아들이는 힘이기도 해요. 다만 상대를 고를 때 내 기준 세 가지를 먼저 적어 두면, 사람이 아니라 기준이 결정하게 돼요. 이 사주에서는 만나기 전의 기준이 관계의 길이를 정해요.", "fact_add": "명리에서는 이 배치를 인연의 별이 나보다 힘이 센 구조로 봅니다. 나를 받쳐 주는 힘이 들어올 때 관계가 편해지는 구조입니다."}, "steady": {"cond": "인연의 별 2 이상(신약 아님)", "one": "사랑에서는, 관계가 생기면 오래 붙잡는 쪽이에요.", "brief": ["인연의 별이 또렷하고 나도 흔들리지 않아서, 관계가 생기면 오래 붙잡는 구조예요.", "특히 끝난 관계도 쉽게 놓지 못하고 오래 마음에 남는 장면이 반복될 수 있어요."], "scene": "관계의 모양을 보면, 한번 마음을 주면 오래 가는 쪽이에요. 가볍게 시작하는 게 어렵고, 시작하면 끝을 생각하지 않아요. 그래서 끝난 관계도 쉽게 놓지 못하고, 오래 마음에 남아요.", "read": "이 구조에서는 인연이 또렷해서 만남 자체는 어렵지 않아요. 다만 오래 붙잡는 힘이 커서 놓아야 할 때를 놓치기 쉬워요. 놓아야 할 때를 미리 정해 두는 게 오히려 관계를 지켜요. 붙잡는 힘과 놓는 기준이 같이 있을 때 이 사주의 사랑이 온전해져요.", "fact_add": "명리에서는 이 배치를 인연의 별이 또렷하고 일간이 그것을 감당하는 구조로 봅니다."}, "expressive": {"cond": "인연의 별 1 이하 + 식상 2 이상", "one": "사랑에서는, 마음을 먼저 보여 주고 상대를 기다리는 쪽이에요.", "brief": ["인연의 별보다 밖으로 내는 힘인 식상이 커서, 마음을 먼저 보여 주고 상대를 기다리는 구조예요.", "특히 내 말이 앞서서 상대의 말이 줄어드는 장면이 반복될 수 있어요."], "scene": "관계의 모양을 보면, 마음이 생기면 숨기지 못하고 먼저 말하는 쪽이에요. 표현이 풍부하고 재미있어서 사람이 잘 모이는데, 정작 깊은 관계에서는 내 말이 앞서 상대의 말이 줄어요. 기다리는 게 어렵고, 답이 늦으면 마음이 먼저 식어요.", "read": "표현이 앞서는 건 관계를 여는 힘이에요. 다만 먼저 보여 준 만큼 기다리는 게 어려워서, 답이 늦으면 마음이 먼저 식기 쉬워요. 말을 반으로 줄이고 상대의 말을 끝까지 들으면 오래 가요. 먼저 보여 주되, 기다리는 시간을 남겨 두세요.", "fact_add": "명리에서는 이 배치를 밖으로 내는 힘이 인연의 별보다 앞서는 구조로 봅니다."}, "independent": {"cond": "인연의 별 1 이하 + 식상 1 이하 + 비겁 2 이상", "one": "사랑에서는, 관계보다 나를 먼저 세우는 쪽이에요.", "brief": ["인연의 별보다 나와 같은 힘인 비겁이 커서, 관계보다 나를 먼저 세우는 구조예요.", "특히 혼자가 편해서 상대에게 자리를 내주지 못하는 장면이 반복될 수 있어요."], "scene": "관계의 모양을 보면, 혼자서도 괜찮은 쪽이에요. 친구는 많은데 연인 자리는 비어 있기 쉽고, 누가 들어오려 하면 내 시간과 방식이 먼저 걸려요. 그래서 상대가 서운해하고, 나는 왜 서운한지 잘 몰라요.", "read": "나를 먼저 세우는 건 관계에서 흔들리지 않는 힘이에요. 다만 상대가 기댈 자리가 없으면 관계가 붙지 않아요. 상대에게 역할 하나를 내주면 그 자리에서 관계가 자라요. 혼자의 시간을 지키되, 둘의 시간을 정해 두는 것이 이 사주의 방법이에요.", "fact_add": "명리에서는 이 배치를 나와 같은 힘이 인연의 별보다 앞서는 구조로 봅니다."}, "quiet": {"cond": "나머지(인연의 별·식상·비겁 모두 1 이하)", "one": "사랑에서는, 인연을 안에서 만들기보다 시기가 데려오는 쪽이에요.", "brief": ["인연의 별이 원국에 세지 않아서, 만남은 안에서보다 시기가 데려오는 구조예요.", "특히 평소에는 조용하다가 어떤 해에만 인연이 한꺼번에 오는 장면이 반복될 수 있어요."], "scene": "관계의 모양을 보면, 평소에는 인연 쪽이 조용한 쪽이에요. 사람이 없어서가 아니라 마음이 크게 움직이는 일이 드물어요. 그러다 어떤 해에는 갑자기 여러 사람이 한꺼번에 다가와서 스스로도 놀라요.", "read": "원국에 별이 약하면 시기로 들어올 때 더 크게 느껴져요. 그래서 이 사주에서는 만남을 만드는 것보다 그 해를 놓치지 않는 게 방법이에요. 인연의 별이 드는 달에 약속을 잡으면 그 만남이 오래 가요. 조용한 해는 나를 채우는 해로 쓰면 돼요.", "fact_add": "당신 원국에는 인연의 별({인연의 별})이 {정 수와 편 수 합: 없거나 하나}입니다. 명리에서는 이 배치를 인연이 세운으로 들어올 때 크게 느껴지는 구조로 봅니다."}}, "fact_template": "명식의 인연 구조에서는, 인연의 별({인연의 별})이 {인연의 별 수}자리{인연의 별 자리가 있으면: ({인연의 별 자리})}입니다. 배우자 자리(일지)에는 {배우자 자리 별}, 곧 {배우자 자리 풀이}이 있습니다. {배우자 자리 별이 인연의 별이면: 인연의 별이 배우자 자리에 앉아 있어, 명리에서는 이를 배우자 인연이 또렷한 자리로 봅니다.} 일간은 {신강·중화·신약}이라 {신강: 사람에게 흔들리지 않는 힘이 있습니다 / 중화: 관계에서 균형이 잡혀 있습니다 / 신약: 사람에게 끌려가기 쉬운 구조입니다}.", "fact_adds_optional": {"female_output": "여성 사주에서 식상은 인연의 별인 관성을 누르는 힘입니다. 당신 사주에는 식상이 // 맥락에 맞는 추천질문 3개: 같은 영역·같은 태그 우선, 다음 같은 영역, 다음 흐름 영역.

    window.scrollTo(0, 0); renderSheet(); renderModal();
    if (state.screen === 'me') loadOrders();
    if (state.screen === 'calc') { const lines = $('#calc-lines').children; [0, 1, 2].forEach(i => setTimeout(() => { lines[i].classList.add('on'); }, 300 + i * 450)); setTimeout(() => { if (state.screen === 'calc') { navigate('#/me'); } }, 1900); }
  }
  function goPending() { const p = store.get('pending', null); store.del('pending'); navigate(p && !/calc|input/.test(p) ? p : '#/now'); }

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-go],[data-act],[data-chat],[data-send],[data-term],.seg button');
    if (!t) return;
    if (t.dataset.go != null) { e.preventDefault(); navigate('#/' + t.dataset.go); return; }
    if (t.dataset.chat != null) { e.preventDefault(); if (!state.facts) { store.set('pending', location.hash || '#/now'); navigate('#/input'); return; } const c = JSON.parse(t.dataset.chat); const ask = c.ask; delete c.ask; openChat(c, ask); return; }
    if (t.dataset.send != null) { e.preventDefault(); sendChat(t.dataset.send); return; }
    if (t.dataset.term != null) { e.preventDefault(); showTerm(t.dataset.term); return; }
    if (t.matches('.seg button')) { const seg = t.parentElement; seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === t)); if (seg.id === 'i-cal') { const w = $('#i-leap-wrap'); if (w) w.hidden = t.dataset.v !== 'lunar'; } return; }
    const a = t.dataset.act;
    if (a === 'back') { if (history.length > 1) history.back(); else navigate('#/home'); }
    else if (a === 'toast') toast(t.dataset.msg || '');
    else if (a === 'scrollto') { const el = $(t.dataset.target); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); else navigate('#/home'); }
    else if (a === 'sheet-close') closeSheet();
    else if (a === 'modal-close') { if (t.classList.contains('modal') && e.target !== t) return; state.modal = null; renderModal(); }
    else if (a === 'pay-ack') { const c = $('#ack-chk'); if (!c || !c.checked) { toast('확인란에 체크해 주세요'); return; } store.set('ack', { at: new Date().toISOString(), version: POLICY.version, item: t.dataset.item, id: t.dataset.id || null }); state.modal = null; renderModal(); pay(t.dataset.item, t.dataset.id || undefined, t.dataset.amount, true); }
    else if (a === 'refund') { state.modal = { title: '환불 문의', body: '<p class="body">' + esc(POLICY.refund ? POLICY.refund.requestIntro : '') + '</p><textarea id="refund-reason" rows="3" placeholder="사유를 적어 주세요(선택)"></textarea><button class="btn primary block" data-act="refund-send" data-order="' + esc(t.dataset.order) + '" style="margin-top:8px">환불 요청 보내기</button>' }; renderModal(); }
    else if (a === 'refund-send') { const reason = ($('#refund-reason') || {}).value || ''; t.disabled = true; SERVER.requestRefund(t.dataset.order, reason).then(() => { state.modal = null; renderModal(); toast('환불 요청을 접수했어요'); route(); }).catch(err => { console.warn(err); t.disabled = false; toast('요청을 보내지 못했어요'); }); }
    else if (a === 'unk') { const b = t; const on = !b.classList.contains('on'); b.classList.toggle('on', on); b.textContent = on ? '몰라요 선택됨' : '몰라요'; $('#i-h').disabled = on; $('#i-mi').disabled = on; state.unk = on; }
    else if (a === 'pending') goPending();
    else if (a === 'ask-send') askFromInput(t.dataset.q);
    else if (a === 'pay') pay(t.dataset.item, t.dataset.id, t.dataset.amount);
    else if (a === 'print') window.print();
    else if (a === 'doc') { const d = DOCS[t.dataset.doc]; state.modal = { title: d[0], body: d[1] }; renderModal(); }
    else if (a === 'login-kakao') { SERVER.signInKakao().catch(e => { console.warn(e); toast('카카오 로그인을 시작하지 못했어요'); }); }
    else if (a === 'share') { const url = location.origin + location.pathname + '#/ilju?src=share'; if (navigator.share) navigator.share({ title: APP_NAME, text: '나는 ' + iljuName() + '. 내 일주도 확인해 보기', url }).catch(() => {}); else if (navigator.clipboard) { navigator.clipboard.writeText(url); toast('링크를 복사했어요'); } }
    else if (a === 'reset-all') { if (confirm('이 기기에 저장된 사주와 기록을 지울까요? 구매 기록은 남아요.')) { ['profile', 'seen', 'threads', 'pending'].forEach(k => store.del(k)); loadProfile(); closeSheet(); navigate('#/home'); route(); } }
  });
  document.addEventListener('submit', e => {
    if (e.target.id === 'f-input') { e.preventDefault(); submitInput(e.target); }
    if (e.target.id === 'chat-form') { e.preventDefault(); const i = $('#chat-in'); const v = i.value; i.value = ''; sendChat(v); }
    if (e.target.id === 'f-email') { e.preventDefault(); const em = $('#i-email').value.trim(); if (!em) return; SERVER.signInEmail(em).then(() => { const m = $('#login-msg'); if (m) m.textContent = '메일을 보냈어요. 메일의 링크를 누르면 이 화면으로 돌아와요.'; }).catch(err => { console.warn(err); const m = $('#login-msg'); if (m) m.textContent = '메일을 보내지 못했어요. 주소를 확인해 주세요.'; }); }
  });
  document.addEventListener('change', e => { if (e.target.id === 'ack-chk') { const b = $('[data-act="pay-ack"]'); if (b) b.disabled = !e.target.checked; } });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'ask-in') { e.preventDefault(); const b = $('[data-act="ask-send"]'); if (b) askFromInput(b.dataset.q); } });
  window.addEventListener('hashchange', route);
  window.MS = { state, store, owned, grant, route };
  document.title = APP_NAME + ' · ' + (CFG.tagline || '');
  loadProfile();
  const boot = () => { localStorage.removeItem('ms_after'); if (!location.hash) location.hash = '#/home'; else route(); };
  if (typeof SERVER !== 'undefined' && SERVER.enabled) {
    SERVER.onAuth(u => { if (u && state.modal && state.modal.login) { state.modal = null; renderModal(); route(); } });
    SERVER.init().then(async () => { const r = await SERVER.completePayment(); if (r && r.ok) { toast('결제가 완료됐어요'); afterPay(r.item, r.id); return; } if (r) toast(r.message); boot(); }).catch(e => { console.warn('server init', e); boot(); });
  } else boot();
})();

</script>
</body>
</html>
